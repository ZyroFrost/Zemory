# zemory in Docker (docs/plan/30) - a parallel path to the native install.
#   docker compose up -d --build     # build the image and start the daemon
#   http://127.0.0.1:4444            # the cockpit
# Set before `up` (the installer writes them into .env beside this file):
#   HOST_HOME        the user's home as Docker sees it - transcripts mounted read-only (Linux: $HOME; compose run from
#                    Ubuntu on Windows: /mnt/c/Users/<u>)
#   HOST_HOME_NATIVE the same home as the agents write it into hook payloads (Windows: C:\Users\<u>; Linux: unset)
#   HOST_WORKSPACE   the folder holding the repos as Docker sees it (Ubuntu on Windows: /mnt/d/Workspace)
#   HOST_WORKSPACE_NATIVE  the same folder as the store names it (Windows: D:\Workspace; Linux: unset)
#   HOST_DRIVE       (optional) the Drive sync folder as Docker sees it (Ubuntu on Windows: /mnt/g/My Drive/<folder>)
#   HOST_DRIVE_NATIVE (optional) the same folder as the config names it (Windows: G:\My Drive\<folder>)
#   ZEMORY_HOSTNAME  this machine's name: every session is stamped with it (`host`), so it must be the machine, not
#                    the container (measured 2026-10-22: a container id was written as the host)
#   ZEMORY_PORT      the host port (default 4444; another port while a native daemon holds 4444)
#   ZEMORY_STORE     the store folder on the host's Linux file system (plan/30 §3c): /home/<user>/zemory - on Windows
#                    run compose from Ubuntu (WSL) so this is ext4, never an NTFS folder (WAL breaks on it)
name: zemory
services:
  zemory:
    build: .
    image: zemory:local
    container_name: zemory
    hostname: ${ZEMORY_HOSTNAME:?set ZEMORY_HOSTNAME to this machine's name}
    ports:
      - "127.0.0.1:${ZEMORY_PORT:-4444}:4444"
      # the sign-in view of the web-capture browser (noVNC, no password): this machine's loopback only
      - "127.0.0.1:${ZEMORY_VIEW_PORT:-6080}:6080"
      # the peer-to-peer channel (TLS, both sides prove a device key): every interface, as the native daemon listens. The
      # channel is for machines on OTHER networks (global discovery + relay go out from the container); LAN discovery's
      # UDP broadcast does not cross Docker's NAT and is not needed for that.
      - "${ZEMORY_P2P_PORT:-21038}:21038"
    # Chromium's shared memory; Docker's default 64 MB crashes tabs
    shm_size: "1gb"
    environment:
      ZEMORY_VIEW_PORT: "${ZEMORY_VIEW_PORT:-6080}"
      # a Drive folder from a Windows drive letter must arrive as a 9p mount; anything else is Docker's empty stand-in
      ZEMORY_DRIVE_FROM_WINDOWS: "${HOST_DRIVE_NATIVE:-}"
      # a hook payload names host paths; the daemon reads them under the mounts below (memory/hook-relay.ts)
      # the Drive sync folder (config keeps the host's path) is the third pair; unset on a machine with no Drive channel
      # the clone's pair comes first: when the clone sits inside the workspace, the longer prefix must win
      ZEMORY_SELF: /host/zemory
      ZEMORY_PATH_MAP: "${ZEMORY_SELF_NATIVE:-}=>/host/zemory;${HOST_HOME_NATIVE:-${HOST_HOME}}/.claude=>/home/node/.claude;${HOST_WORKSPACE_NATIVE:-${HOST_WORKSPACE}}=>/host/workspace;${HOST_DRIVE_NATIVE:-}=>/host/drive;${HOST_DATA_ROOT_NATIVE:-}=>/host/data"
    volumes:
      # everything zemory keeps lives here, in one place on the Linux disk (plan/30 §3k): the GM, the model, the machine's data
      - ${ZEMORY_STORE:?set ZEMORY_STORE to /home/<user>/zemory}:/home/node/zemory
      - ${HOST_HOME:?set HOST_HOME to your home folder}/.claude:/home/node/.claude:ro
      # the repos: project roots are stored as host paths and looked up here (util/hostpath.ts). Writable: `zemory sync`,
      # `init`, `archive`, `paths fix` write into a repo here as the native CLI does; the agent's own edits are guarded
      # on the host (docs/hooks/guard.cjs runs there), not here
      - ${HOST_WORKSPACE:?set HOST_WORKSPACE to the folder holding your repos}:/host/workspace
      # the Drive sync folder, written to (the channel appends its blocks there). Docker Desktop cannot see a Google Drive
      # letter (G:) and silently mounts an empty folder instead (measured 2026-10-22): mount it in Ubuntu first
      # (/etc/fstab: `G: /mnt/g drvfs metadata,noatime 0 0`) and name the Ubuntu path here
      - ${HOST_DRIVE:-${ZEMORY_STORE}/no-drive}:/host/drive
      # the data drive's root, read-only: `zemory conform --layout` checks the whole drive (plan/32: Software/ · AppConfig/ ·
      # Workspace/ …). Its pair comes LAST in ZEMORY_PATH_MAP - the shortest prefix, so every longer one wins first
      - ${HOST_DATA_ROOT:-${HOST_WORKSPACE}}:/host/data:ro
      # zemory's own repo: the clone this image is built from. HS (docs_template) is read and the sets are rebuilt here,
      # so a change made to HS on the host is what the container sees (not the copy frozen into the image), and its .git
      # holds the history a three-way sync reads (docs/store.ts baseFiles)
      - .:/host/zemory
    restart: unless-stopped
    # a reaper as PID 1: the daemon does not wait on the browser's and the display's children, which stayed <defunct>
    init: true
